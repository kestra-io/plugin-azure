worker:
  controllers:
    type: STATIC
    static:
      endpoints:
        - host: localhost

kestra:
  repository:
    type: memory
  queue:
    type: memory
  storage:
    type: local
    local:
      base-path: /tmp/unittest
  controller:
    # keep out of the ephemeral port range (32768-60999): an outbound socket could steal
    # a random.port between config resolution and the controller bind
    port: ${random.int[20000,32000]}
  worker:
    controllers:
      type: STATIC
      static:
        endpoints:
          - host: localhost
            port: ${kestra.controller.port}
  variables:
    globals:
      azure:
        blobs:
          endpoint: "https://unittestkt.blob.core.windows.net"
          container: tasks
          connection-string: ""
        tables:
          endpoint: "https://unittestkt.table.core.windows.net"
          table: tasks
        adls:
          endpoint: "https://unittestkt.blob.core.windows.net/tasks"
          file-system: tasks
        batch:
          endpoint: "https://batchunitest.francecentral.batch.azure.com"
          account: batchunitest
          pool-id: azure-unit-test
          job-id: job-unit-test
        eventhubs:
          eventhub-name: ""
          connection-string: ""
          checkpointstore:
            connection-string: ""
            container-name: ""
        datafactory:
          tenantId: ""
          subscriptionId: ""
        monitoring:
          tenantId: ""
          resourceId: "/subscriptions/YOUR_SUB_ID/resourceGroups/YOUR_RG/providers/Microsoft.Compute/virtualMachines/YOUR_VM"
          metricsNamespace: "Microsoft.Compute/virtualMachines"
        cosmos:
          endpoint: "https://cosmos-unit-test.documents.azure.com"
          database-id: "cosmos-database-unit-test"
          container-id: "cosmos-container-unit-test"
          connection-string: ""
        servicebus:
          queue-name: "unittest-queue"
          topic-name: "unittest-topic"
          connection-string: ""
        sp:
          username: ""
          secret: ""
          tenant: ""

# Disable Micronaut embedded gRPC server
grpc:
  server:
    enabled: false
